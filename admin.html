<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Restaurateur - Le Paradis d'Avignon</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-dashboard { padding: 8rem 5% 5rem 5%; min-height: 100vh; background-color: var(--light); }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; flex-wrap: wrap; gap: 1rem;}
        .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; margin-bottom: 3rem; }
        .stat-card { background: white; padding: 2rem; border-radius: 20px; box-shadow: var(--shadow); text-align: center; border: 1px solid rgba(0,0,0,0.05); }
        .stat-card h3 { font-size: 3rem; color: var(--primary); margin-bottom: 0.5rem; font-family: var(--font-heading); }
        .stat-card p { margin: 0; color: #666; font-weight: 600; font-size: 1.1rem; }
        
        .reservations-table-container { background: white; border-radius: 20px; box-shadow: var(--shadow); overflow-x: auto; padding: 2rem; border: 1px solid rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #eee; }
        th { font-weight: 600; color: var(--dark); font-family: var(--font-heading); font-size: 1.1rem; }
        tr:last-child td { border-bottom: none; }
        .status-badge { padding: 0.4rem 0.8rem; border-radius: 50px; font-size: 0.85rem; font-weight: 600; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #d4edda; color: #155724; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; transition: transform 0.2s; }
        .action-btn:hover { transform: scale(1.2); }
        .btn-clear { background: var(--dark); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 10px; cursor: pointer; font-weight: 600; transition: background 0.3s; }
        .btn-clear:hover { background: #1a1a1a; }
    </style>
</head>
<body>
    <nav class="navbar scrolled">
        <div class="logo">🏰 Espace Pro</div>
        <ul class="nav-links" style="display: flex;">
            <li><a href="index.html" class="btn-primary">Retour au site</a></li>
        </ul>
    </nav>

    <div class="admin-dashboard">
        <div class="dashboard-header">
            <h2>Tableau de bord des réservations</h2>
            <button onclick="clearReservations()" class="btn-clear"><i class="fas fa-trash"></i> Vider l'historique</button>
        </div>

        <div class="stat-cards">
            <div class="stat-card">
                <h3 id="total-res">0</h3>
                <p>Total Réservations</p>
            </div>
            <div class="stat-card">
                <h3 id="today-res">0</h3>
                <p>Pour Aujourd'hui</p>
            </div>
            <div class="stat-card">
                <h3 id="total-guests">0</h3>
                <p>Couverts Prévus</p>
            </div>
        </div>

        <div class="reservations-table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date & Heure</th>
                        <th>Nom du client</th>
                        <th>Couverts</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="reservations-body">
                    <!-- Dynamic content -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadReservations() {
            const reservations = JSON.parse(localStorage.getItem('reservations')) || [];
            const tbody = document.getElementById('reservations-body');
            
            // Sort by date and time
            reservations.sort((a, b) => {
                const dateA = new Date(`${a.date}T${a.time}`);
                const dateB = new Date(`${b.date}T${b.time}`);
                return dateA - dateB;
            });

            tbody.innerHTML = '';
            
            let todayCount = 0;
            let totalGuests = 0;
            
            // Generate current date as YYYY-MM-DD local
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            reservations.forEach(res => {
                if (res.date === todayStr) todayCount++;
                totalGuests += parseInt(res.guests);

                const tr = document.createElement('tr');
                
                const dateObj = new Date(res.date);
                const formattedDate = dateObj.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

                tr.innerHTML = `
                    <td><strong>${formattedDate}</strong> à ${res.time}</td>
                    <td>${res.name}<br><small style="color: #666;"><i class="fas fa-envelope"></i> ${res.email || 'Non renseigné'}</small></td>
                    <td><i class="fas fa-user"></i> ${res.guests}</td>
                    <td><span class="status-badge ${res.status === 'confirmed' ? 'status-confirmed' : 'status-pending'}">${res.status === 'confirmed' ? 'Confirmée' : 'Nouvelle'}</span></td>
                    <td>
                        ${res.status === 'pending' ? `<button onclick="confirmReservation(${res.id})" class="action-btn" title="Confirmer" style="color: #4ECDC4;"><i class="fas fa-check-circle"></i></button>` : ''}
                        <button onclick="deleteReservation(${res.id})" class="action-btn" title="Supprimer" style="margin-left: 0.8rem; color: #FF6B6B;"><i class="fas fa-times-circle"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if (reservations.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem;">Aucune réservation pour le moment.</td></tr>';
            }

            document.getElementById('total-res').textContent = reservations.length;
            document.getElementById('today-res').textContent = todayCount;
            document.getElementById('total-guests').textContent = totalGuests;
        }

        function confirmReservation(id) {
            let reservations = JSON.parse(localStorage.getItem('reservations')) || [];
            const index = reservations.findIndex(r => r.id === id);
            if (index !== -1) {
                reservations[index].status = 'confirmed';
                localStorage.setItem('reservations', JSON.stringify(reservations));
                loadReservations();
            }
        }

        function deleteReservation(id) {
            if(confirm("Êtes-vous sûr de vouloir supprimer cette réservation ?")) {
                let reservations = JSON.parse(localStorage.getItem('reservations')) || [];
                reservations = reservations.filter(r => r.id !== id);
                localStorage.setItem('reservations', JSON.stringify(reservations));
                loadReservations();
            }
        }

        function clearReservations() {
            if(confirm("Attention, cela va effacer toutes les réservations. Continuer ?")) {
                localStorage.removeItem('reservations');
                loadReservations();
            }
        }

        // Initial load
        loadReservations();
    </script>
</body>
</html>
